<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Password Generator</title>
    <link rel="stylesheet" href="pass.css">
</head>
<body>
    <div class="container">
        <h1>Generate a <br><span>Random Password</span></h1>
        <div class="display">
            <input type="text" id="password" placeholder="Password">
            <button type="button" id="copy-btn" class="copy-btn" aria-label="Copy password" disabled><img src="images/copy.png" alt=""></button>
        </div>
        <label class="length-control" for="length-input">Password length<input type="number" id="length-input" min="4" max="64" step="1" value="12"></label>
        <button type="button" id="generate-btn"><img src="images/generate.png">Generate Password</button>
        <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
    </div>
    <script src="pass.js"></script>
</body>
</html>
